name: Build Telegram iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install dependencies
        run: |
          brew unlink bazelisk 2>/dev/null || true
          brew install cmake ninja
          python3 -m pip install --break-system-packages cmake-format

      - name: Build IPA
        run: |
          # Запуск сборки без подписи (для Sideloadly/AltStore)
          python3 build-system/Make/Make.py build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber 1 \
            --outputBuildArtifactsPath=build/artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-ipa
          path: build/artifacts/
          retention-days: 7

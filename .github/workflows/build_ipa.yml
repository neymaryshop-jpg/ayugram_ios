name: Build Telegram iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install dependencies
        run: |
          brew unlink bazelisk 2>/dev/null || true
          brew install cmake ninja pkg-config
          python3 -m pip install --break-system-packages cmake-format

      - name: Regenerate fake provisioning profiles for our bundle id
        run: |
          python3 build-system/Make/GenerateSwiftgramProfiles.py \
            --team-id C67CF9S4VU \
            --bundle-id com.neymarynight.ayugram \
            --old-bundle-id ph.telegra.Telegraph \
            --input-dir build-system/fake-codesigning/profiles \
            --output-dir build-system/fake-codesigning/profiles \
            --certs-dir build-system/fake-codesigning/certs

      - name: Import signing certificates
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          security find-identity -v -p codesigning || true

      - name: Build IPA
        run: |
          # Сборка с самоподписанной подписью (для Sideloadly/AltStore)
          python3 build-system/Make/Make.py build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber 1 \
            --disableExtensions \
            --outputBuildArtifactsPath=build/artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-ipa
          path: build/artifacts/
          retention-days: 7
